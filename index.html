
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Convertisseur WEBP</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#101827;color:white;margin:0;padding:20px}
main{max-width:600px;margin:auto}
h1{text-align:center;color:#55c9ff}
.card{background:#1e293b;padding:18px;border-radius:15px;margin:15px 0}
input,select,button{width:100%;padding:13px;margin:8px 0;border-radius:9px;border:1px solid #475569;font-size:16px}
input,select{background:#0f172a;color:white}
button{background:#0891b2;color:white;border:0;font-weight:bold}
button:disabled{opacity:.5}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#files{background:#0f172a}
.item{padding:12px;border-bottom:1px solid #475569;overflow-wrap:anywhere}
a{color:#55c9ff}
small{color:#cbd5e1}
</style>
</head>
<body>
<main>
<h1>🖼️ Convertisseur WEBP</h1>
<p style="text-align:center">Convertir et redimensionner vos images facilement</p>

<div class="card">
<h3>1. Choisir les images</h3>
<input type="file" id="files" accept="image/*" multiple>
<small>JPG, PNG, GIF, BMP, WEBP et formats compatibles</small>
</div>

<div class="card">
<h3>2. Dimensions personnalisées</h3>
<div class="grid">
<label>Largeur (px)<input type="number" id="w" value="800" min="1" max="12000"></label>
<label>Hauteur (px)<input type="number" id="h" value="800" min="1" max="12000"></label>
</div>
<label><input type="checkbox" id="ratio" style="width:auto"> Conserver les proportions</label>
<label>Mode de redimensionnement
<select id="mode">
<option value="contain">Ajuster sans déformer</option>
<option value="cover">Remplir et recadrer</option>
<option value="stretch">Dimensions exactes</option>
</select></label>
<label>Qualité WEBP : <span id="qv">85%</span>
<input type="range" id="q" min="10" max="100" value="85"></label>
</div>

<div class="card">
<h3>3. Conversion</h3>
<button id="convert">⚡ Convertir en WEBP</button>
<p id="status">En attente des images.</p>
<div id="results"></div>
<button id="all" hidden>Télécharger toutes les images</button>
</div>
<p style="text-align:center"><small>🔒 Vos images restent sur votre appareil. Aucune image n'est envoyée sur un serveur.</small></p>
</main>
<script>
const $=id=>document.getElementById(id);
let results=[];
$('q').oninput=()=> $('qv').textContent=$('q').value+'%';
$('ratio').onchange=()=>{
 if($('ratio').checked){
 const w=+$('w').value,h=+$('h').value;
 $('h').dataset.ratio=w&&h?h/w:1;
 }
};
$('w').oninput=()=>{
 if($('ratio').checked){
 $('h').value=Math.round(+$('w').value*(+$('h').dataset.ratio||1));
 }
};
$('h').oninput=()=>{
 if($('ratio').checked){
 $('w').value=Math.round(+$('h').value/(+$('h').dataset.ratio||1));
 }
};
function load(file){
 return new Promise((resolve,reject)=>{
 const url=URL.createObjectURL(file),img=new Image();
 img.onload=()=>resolve({img,url});
 img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('Image non compatible'))};
 img.src=url;
 });
}
function blob(canvas,q){
 return new Promise((resolve,reject)=>{
 canvas.toBlob(b=>b?resolve(b):reject(Error('Conversion impossible')),'image/webp',q);
 });
}
$('convert').onclick=async()=>{
 const files=[...$('files').files],w=+$('w').value,h=+$('h').value;
 if(!files.length){$('status').textContent='Choisissez des images.';return}
 if(!Number.isInteger(w)||!Number.isInteger(h)||w<1||h<1||w>12000||h>12000){
 $('status').textContent='Dimensions invalides.';return;
 }
 $('convert').disabled=true;
 $('all').hidden=true;
 results.forEach(x=>URL.revokeObjectURL(x.url));
 results=[];
 $('results').innerHTML='';
 for(let i=0;i<files.length;i++){
 $('status').textContent='Conversion '+(i+1)+' / '+files.length;
 try{
 const {img,url}=await load(files[i]);
 let canvas=document.createElement('canvas');
 canvas.width=w;canvas.height=h;
 let ctx=canvas.getContext('2d');
 let mode=$('mode').value;
 if(mode==='stretch')ctx.drawImage(img,0,0,w,h);
 else{
 let s=mode==='contain'?Math.min(w/img.width,h/img.height):Math.max(w/img.width,h/img.height);
 let dw=img.width*s,dh=img.height*s;
 ctx.drawImage(img,(w-dw)/2,(h-dh)/2,dw,dh);
 }
 URL.revokeObjectURL(url);
 let b=await blob(canvas,+$('q').value/100);
 let name=files[i].name.replace(/\.[^.]+$/,'')+'_'+w+'x'+h+'.webp';
 let item={blob:b,url:URL.createObjectURL(b),name};
 results.push(item);
 let div=document.createElement('div');div.className='item';
 let a=document.createElement('a');a.href=item.url;a.download=name;a.textContent='⬇ '+name;
 div.append(a,document.createElement('br'));
 let small=document.createElement('small');small.textContent=(b.size/1024).toFixed(1)+' KB';
 div.append(small);$('results').append(div);
 }catch(e){
 let div=document.createElement('div');div.className='item';
 div.textContent=files[i].name+' : '+e.message;
 $('results').append(div);
 }
 }
 $('status').textContent=results.length+' image(s) convertie(s).';
 $('all').hidden=!results.length;
 $('convert').disabled=false;
};
$('all').onclick=async()=>{
 for(let i=0;i<results.length;i++){
 let a=document.createElement('a');
 a.href=results[i].url;a.download=results[i].name;
 document.body.append(a);a.click();a.remove();
 await new Promise(r=>setTimeout(r,300));
 }
};
</script>
</body>
</html>
